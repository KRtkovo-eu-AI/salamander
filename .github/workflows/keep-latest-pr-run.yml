# | Date | Summary | Reason | Ticket | Model |
# | 2026-11-25 | Cancel older runs with gh instead of a downloaded action. | A timed-out action download cancelled the caller and left skipped checks on the pull request. | https://github.com/KRtkovo-eu-AI/salamander/pull/843 | Grok 4.7 |
# | 2026-11-04 | Cancel older queued runs of the calling workflow. | A new pull request push should replace runs already waiting for a runner. | | Grok 4.7 |

name: Keep latest pull request run

on:
  workflow_call:
    inputs:
      workflow_file:
        description: Workflow file name, for example pr-tests.yml
        required: true
        type: string
      current_run_id:
        description: Run id of the caller. Only older runs are cancelled.
        required: true
        type: string
      event_name:
        description: Event that started the caller
        required: true
        type: string
      head_branch:
        description: Pull request head branch, or the ref name for a manual run
        required: true
        type: string
      head_repository:
        description: Repository that owns the head branch
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  keep-latest:
    name: Cancel older queued runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel older runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_WORKFLOW_FILE: ${{ inputs.workflow_file }}
          KEEP_CURRENT_RUN_ID: ${{ inputs.current_run_id }}
          KEEP_EVENT_NAME: ${{ inputs.event_name }}
          KEEP_HEAD_BRANCH: ${{ inputs.head_branch }}
          KEEP_HEAD_REPOSITORY: ${{ inputs.head_repository }}
        shell: bash
        run: |
          set -u
          if [ -z "${KEEP_WORKFLOW_FILE}" ] || [ -z "${KEEP_CURRENT_RUN_ID}" ] || [ -z "${KEEP_EVENT_NAME}" ] || [ -z "${KEEP_HEAD_BRANCH}" ]; then
            echo "keep-latest-pr-run requires workflow_file, current_run_id, event_name, and head_branch." >&2
            exit 1
          fi

          cancelled=0
          for status in queued in_progress waiting requested pending; do
            if ! runs=$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${KEEP_WORKFLOW_FILE}/runs" \
              -f status="${status}" \
              -f branch="${KEEP_HEAD_BRANCH}" \
              -f per_page=100 \
              --jq '.workflow_runs[] | [.id, .event, .head_branch, (.head_repository.full_name // ""), .html_url] | @tsv'); then
              echo "::warning::Could not list ${status} runs of ${KEEP_WORKFLOW_FILE}."
              continue
            fi

            while IFS=$'\t' read -r id event branch repository url; do
              if [ -z "${id}" ]; then
                continue
              fi
              if [ "${id}" -ge "${KEEP_CURRENT_RUN_ID}" ]; then
                continue
              fi
              if [ "${event}" != "${KEEP_EVENT_NAME}" ]; then
                continue
              fi
              if [ -n "${repository}" ] && [ -n "${KEEP_HEAD_REPOSITORY}" ] && [ "${repository}" != "${KEEP_HEAD_REPOSITORY}" ]; then
                continue
              fi
              if [ -n "${branch}" ] && [ "${branch}" != "${KEEP_HEAD_BRANCH}" ]; then
                continue
              fi
              if gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null; then
                cancelled=$((cancelled + 1))
                echo "Cancelled older ${status} run ${id} (${url})."
              else
                echo "::warning::Could not cancel run ${id}. This token may not be allowed to cancel workflow runs."
              fi
            done < <(printf '%s\n' "${runs}")
          done

          echo "Cancelled ${cancelled} older ${KEEP_WORKFLOW_FILE} run(s) for ${KEEP_HEAD_REPOSITORY}@${KEEP_HEAD_BRANCH}."
