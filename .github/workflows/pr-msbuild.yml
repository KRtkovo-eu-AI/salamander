name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-msbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} Debug (fail on warnings)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win32
            msvc_arch: x64
            sftp_triplet: x86-windows
          - platform: x64
            msvc_arch: x64
            sftp_triplet: x64-windows
          - platform: ARM64
            msvc_arch: x64_arm64
            sftp_triplet: arm64-windows

    defaults:
      run:
        shell: pwsh
        working-directory: s

    env:
      BUILD_CONFIGURATION: Debug
      # SFTP is not shipped yet; keep this off to avoid building the plugin and
      # its vcpkg dependencies during PR validation.
      BUILD_SFTP_PLUGIN: 'false'
      SOLUTION_PATH: '.\src\vcxproj\salamand.sln'
      LOG_DIRECTORY: build_logs

    steps:
      - name: Check whether build-relevant files changed
        id: build_changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('has_build_relevant_changes', 'true');
              core.setOutput('changed_files_json', '[]');
              core.info('Not a pull_request event; PR build will run for the full solution.');
              return;
            }

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            const buildRelevantPattern = /\.(?:c|cc|cpp|cxx|h|hh|hpp|hxx|inl|cs|rc|rc2|idl|def|asm|s)$/i;
            const relevantFiles = changedFiles
              .map((file) => file.filename)
              .filter((filename) => buildRelevantPattern.test(filename));

            const shouldRun = relevantFiles.length > 0;
            core.setOutput('has_build_relevant_changes', shouldRun ? 'true' : 'false');
            core.setOutput('changed_files_json', JSON.stringify(relevantFiles));
            core.info(
              shouldRun
                ? `PR build will run because these build-relevant files changed: ${relevantFiles.join(', ')}`
                : 'No build-relevant source files changed; PR build steps will be skipped while the required workflow succeeds.',
            );

      - name: Checkout
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true'
        uses: actions/checkout@v4
        with:
          path: s
          submodules: recursive

      - name: Provide shared plugin files for SFTP submodule
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true' && env.BUILD_SFTP_PLUGIN == 'true'
        run: |
          $sftpShared = Join-Path (Get-Location) 'src\plugins\sftp\shared'
          New-Item -ItemType Directory -Force -Path $sftpShared | Out-Null
          Copy-Item -Path '.\src\plugins\shared\*' -Destination $sftpShared -Recurse -Force

      - name: Configure SFTP submodule build
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true' && env.BUILD_SFTP_PLUGIN == 'true'
        run: |
          $sftpRoot = Join-Path (Get-Location) 'src\plugins\sftp'
          $directoryBuildProps = Join-Path $sftpRoot 'Directory.Build.props'
          @'
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>OPENSSL_SUPPRESS_DEPRECATED;%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          '@ | Set-Content -Path $directoryBuildProps -Encoding UTF8

          if ('${{ matrix.platform }}' -eq 'Win32') {
            $sftpProps = Join-Path $sftpRoot 'src\vcxproj\sftp.props'
            (Get-Content -LiteralPath $sftpProps) |
              ForEach-Object { $_ -replace 'libcrypto-3-x64\.dll', 'libcrypto-3.dll' } |
              Set-Content -LiteralPath $sftpProps -Encoding UTF8
          }

      - name: Setup MSBuild in PATH (VS2022)
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Command Prompt (${{ matrix.msvc_arch }} toolchain)
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Register MSVC problem matcher
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true'
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Install SFTP plugin dependencies
        if: steps.build_changes.outputs.has_build_relevant_changes == 'true' && env.BUILD_SFTP_PLUGIN == 'true'
        run: |
          .\tools\vcpkg\build-third-party-libs.ps1 -SftpPlugin -OnlySftpPlugin -Triplet '${{ matrix.sftp_triplet }}'

      - name: Select changed projects
        if: github.event_name == 'pull_request' && steps.build_changes.outputs.has_build_relevant_changes == 'true'
        id: changed_projects
        env:
          CHANGED_FILES_JSON: ${{ steps.build_changes.outputs.changed_files_json }}
        run: |
          $solutionPath = Join-Path (Get-Location) $env:SOLUTION_PATH
          $solutionDir = Split-Path -Parent $solutionPath
          $changedFiles = $env:CHANGED_FILES_JSON | ConvertFrom-Json
          $projectMatches = Select-String -LiteralPath $solutionPath -Pattern '^Project\("\{[^}]+\}"\) = "([^"]+)", "([^"]+)", "\{([^}]+)\}"'
          $projects = foreach ($match in $projectMatches) {
            $relativePath = $match.Matches[0].Groups[2].Value
            if ($relativePath -notmatch '\.(?:vcxproj|csproj)$') { continue }

            $absolutePath = [System.IO.Path]::GetFullPath((Join-Path $solutionDir $relativePath))
            $repoRelativePath = [System.IO.Path]::GetRelativePath((Get-Location), $absolutePath).Replace('\', '/')
            $projectRoot = (Split-Path -Parent $repoRelativePath).Replace('\', '/')
            if ($repoRelativePath -match '^src/plugins/([^/]+)/') {
              $projectRoot = "src/plugins/$($Matches[1])"
            }

            [pscustomobject]@{
              Name = $match.Matches[0].Groups[1].Value
              Path = $repoRelativePath
              Root = $projectRoot
            }
          }

          $selected = [System.Collections.Generic.List[object]]::new()
          foreach ($file in $changedFiles) {
            $normalizedFile = $file.Replace('\', '/')
            $owners = @($projects | Where-Object {
              $normalizedFile -eq $_.Path -or (
                $normalizedFile.StartsWith($_.Root + '/') -and
                ($_.Root -ne 'src' -or $normalizedFile -match '^src/(?!plugins/)')
              )
            })

            if ($owners.Count -eq 0 -and $normalizedFile -match '^src/(?!plugins/)' ) {
              $owners = @($projects | Where-Object { $_.Name -in @('salamand', 'lang') })
            }

            foreach ($owner in $owners) {
              if ($env:BUILD_SFTP_PLUGIN -ne 'true' -and $owner.Name -in @('sftp', 'lang_sftp')) { continue }
              if ('${{ matrix.platform }}' -in @('x64', 'ARM64') -and $owner.Name -eq 'salextx86') { continue }
              if ('${{ matrix.platform }}' -eq 'Win32' -and $owner.Name -eq 'salextx64') { continue }
              if (-not ($selected | Where-Object { $_.Path -eq $owner.Path })) {
                $selected.Add($owner)
              }
            }
          }

          if ($selected.Count -eq 0) {
            Write-Host 'No changed files map to projects in the PR solution; build steps will be skipped.'
          } else {
            Write-Host 'Changed projects selected for build:'
            $selected | ForEach-Object { Write-Host " - $($_.Name): $($_.Path)" }
          }

          $json = $selected.Path | ConvertTo-Json -Compress
          if ($selected.Count -eq 1) { $json = ConvertTo-Json @($selected[0].Path) -Compress }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "project_paths_json=$json"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changed_projects=$(if ($selected.Count -gt 0) { 'true' } else { 'false' })"

      - name: Build changed projects via MSBuild (Debug | ${{ matrix.platform }})
        if: github.event_name == 'pull_request' && steps.changed_projects.outputs.has_changed_projects == 'true'
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $suffix = "${{ matrix.platform }}-run$($env:GITHUB_RUN_NUMBER)"
          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-$suffix.log"

          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"
          
          $projectPaths = '${{ steps.changed_projects.outputs.project_paths_json }}' | ConvertFrom-Json
          foreach ($projectPath in $projectPaths) {
            Write-Host "Building changed project: $projectPath"
            $arguments = @(
              $projectPath
              '/m'
              '/t:Rebuild'
              "/p:Configuration=$($env:BUILD_CONFIGURATION)"
              "/p:Platform=${{ matrix.platform }}"
              '/p:PreferredToolArchitecture=x64'
              '/warnaserror'
              '/nr:false'
              '/v:m'
            )

            msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8 -Append

            if ($LASTEXITCODE -ne 0) {
              Write-Host "MSBuild failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }


      - name: Build full solution via MSBuild (Debug | ${{ matrix.platform }})
        if: github.event_name == 'workflow_dispatch'
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $suffix = "${{ matrix.platform }}-full-run$($env:GITHUB_RUN_NUMBER)"
          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-$suffix.log"

          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"

          $solutionPath = Join-Path (Get-Location) $env:SOLUTION_PATH
          $solutionDir = Split-Path -Parent $solutionPath
          $solutionFilterPath = Join-Path $solutionDir 'salamand-without-sftp.slnf'
          $projects = Select-String -LiteralPath $solutionPath -Pattern '^Project\("\{[^}]+\}"\) = "([^"]+)", "([^"]+)", "\{[^}]+\}"' |
            ForEach-Object {
              [pscustomobject]@{
                Name = $_.Matches[0].Groups[1].Value
                Path = $_.Matches[0].Groups[2].Value
              }
            } |
            Where-Object { $_.Path -match '\.(?:vcxproj|csproj)$' -and $_.Name -notin @('sftp', 'lang_sftp') } |
            ForEach-Object { $_.Path }

          @{
            solution = @{
              path = Split-Path -Leaf $solutionPath
              projects = @($projects)
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $solutionFilterPath -Encoding UTF8

          Write-Host "Building full solution without SFTP projects via $solutionFilterPath"

          $arguments = @(
            $solutionFilterPath
            '/m'
            '/t:Rebuild'
            "/p:Configuration=$($env:BUILD_CONFIGURATION)"
            "/p:Platform=${{ matrix.platform }}"
            '/p:PreferredToolArchitecture=x64'
            '/warnaserror'
            '/nr:false'
            '/v:m'
          )

          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload build logs
        if: always() && (github.event_name == 'workflow_dispatch' || steps.changed_projects.outputs.has_changed_projects == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-${{ matrix.platform }}-debug-logs
          path: |
            ${{ env.LOG_PATH }}
          if-no-files-found: warn
