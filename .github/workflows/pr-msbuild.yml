name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-msbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} Debug (fail on warnings)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        platform: ["Win32", "x64"]

    defaults:
      run:
        shell: pwsh
        working-directory: s

    env:
      BUILD_CONFIGURATION: Debug
      # SFTP is not shipped yet; keep this off to avoid building the plugin and
      # its vcpkg dependencies during PR validation.
      BUILD_SFTP_PLUGIN: 'false'
      SOLUTION_PATH: '.\src\vcxproj\salamand.sln'
      LOG_DIRECTORY: build_logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: s
          submodules: recursive

      - name: Provide shared plugin files for SFTP submodule
        if: env.BUILD_SFTP_PLUGIN == 'true'
        run: |
          $sftpShared = Join-Path (Get-Location) 'src\plugins\sftp\shared'
          New-Item -ItemType Directory -Force -Path $sftpShared | Out-Null
          Copy-Item -Path '.\src\plugins\shared\*' -Destination $sftpShared -Recurse -Force

      - name: Configure SFTP submodule build
        if: env.BUILD_SFTP_PLUGIN == 'true'
        run: |
          $sftpRoot = Join-Path (Get-Location) 'src\plugins\sftp'
          $directoryBuildProps = Join-Path $sftpRoot 'Directory.Build.props'
          @'
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>OPENSSL_SUPPRESS_DEPRECATED;%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          '@ | Set-Content -Path $directoryBuildProps -Encoding UTF8

          if ('${{ matrix.platform }}' -eq 'Win32') {
            $sftpProps = Join-Path $sftpRoot 'src\vcxproj\sftp.props'
            (Get-Content -LiteralPath $sftpProps) |
              ForEach-Object { $_ -replace 'libcrypto-3-x64\.dll', 'libcrypto-3.dll' } |
              Set-Content -LiteralPath $sftpProps -Encoding UTF8
          }

      - name: Setup MSBuild in PATH (VS2022)
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Register MSVC problem matcher
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Install SFTP plugin dependencies
        if: env.BUILD_SFTP_PLUGIN == 'true'
        run: |
          $triplet = if ('${{ matrix.platform }}' -eq 'Win32') { 'x86-windows' } else { 'x64-windows' }
          .\tools\vcpkg\build-third-party-libs.ps1 -SftpPlugin -OnlySftpPlugin -Triplet $triplet

      - name: Disable SFTP projects in PR solution
        if: env.BUILD_SFTP_PLUGIN != 'true'
        run: |
          $solutionPath = Join-Path (Get-Location) $env:SOLUTION_PATH
          $solution = Get-Content -LiteralPath $solutionPath
          $sftpProjectIds = @(
            '514DA5DF-C9D5-4A39-9BE6-CBCFA6CE0D5A', # sftp
            '2D3A2ADD-498B-4420-8E08-6A9FC9C09D5E'  # lang_sftp
          )

          foreach ($projectId in $sftpProjectIds) {
            $solution = $solution | Where-Object {
              $_ -notmatch "\{$projectId\}\..*\.Build\.0\s*="
            }
          }

          $solution | Set-Content -LiteralPath $solutionPath -Encoding UTF8

      - name: Build via MSBuild (Debug | ${{ matrix.platform }})
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $suffix = "${{ matrix.platform }}-run$($env:GITHUB_RUN_NUMBER)"
          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-$suffix.log"

          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"
          
          $arguments = @(
            $env:SOLUTION_PATH
            '/m'
            '/t:Rebuild'
            "/p:Configuration=$($env:BUILD_CONFIGURATION)"
            "/p:Platform=${{ matrix.platform }}"
            '/p:PreferredToolArchitecture=x64'
            '/warnaserror'
            '/nr:false'
            '/v:m'
          )

          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-${{ matrix.platform }}-debug-logs
          path: |
            ${{ env.LOG_PATH }}
          if-no-files-found: warn
