name: Source Code Growth

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: code-growth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Source growth against latest Samandarin release
    runs-on: windows-2022
    timeout-minutes: 10

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source and release tags
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch canonical Samandarin release tags
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git remote add canonical "https://github.com/${{ github.repository }}.git"
          git fetch canonical 'refs/tags/5.0-samandarin-*:refs/tags/5.0-samandarin-*'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source metrics analyzer
        run: python -m pip install --disable-pip-version-check lizard==1.23.0

      - name: Generate source code growth report
        id: report
        run: |
          New-Item -ItemType Directory -Force -Path code-growth-report | Out-Null
          python tools/code_metrics/report_code_growth.py `
            --repository-root . `
            --current-label '${{ github.event.pull_request.head.sha || github.sha }}' `
            --output-json code-growth-report/report.json `
            --output-markdown code-growth-report/report.md
          Get-Content code-growth-report/report.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $report = Get-Content code-growth-report/report.json -Raw | ConvertFrom-Json
          $delta = [int]$report.comparison.summary.deltaNloc
          "title=$('{0:+#,#;-#,#;0} NLOC' -f $delta)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Show source growth summary on the PR check
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          REPORT_TITLE: ${{ steps.report.outputs.title }}
        run: |
          $summary = Get-Content code-growth-report/report.md -Raw
          @{
            output = @{
              title = $env:REPORT_TITLE
              summary = $summary
            }
          } |
            ConvertTo-Json -Depth 3 -Compress |
            gh api `
              --method PATCH `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              "repos/$env:GITHUB_REPOSITORY/check-runs/$env:CHECK_RUN_ID" `
              --input -

      - name: Publish source growth report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_PATH: code-growth-report/report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- source-code-growth-report -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const footer = `\n\n---\n<sub>Automatically updated for \`${process.env.HEAD_SHA}\`. [Open workflow run](${runUrl}).</sub>`;
            const body = `${marker}\n${report}${footer}`;

            if (body.length > 65000) {
              core.setFailed(`Source growth report is too large for a PR comment (${body.length} characters).`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              const updated = await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated source growth report: ${updated.data.html_url}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Published source growth report: ${created.data.html_url}`);
            }

      - name: Upload source growth report
        uses: actions/upload-artifact@v4
        with:
          name: source-code-growth-report
          path: code-growth-report/*
          if-no-files-found: error
          retention-days: 14
