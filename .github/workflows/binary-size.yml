name: Binary Size

on:
  workflow_call:
    inputs:
      head_sha:
        description: PR head commit represented by the uploaded x64 Release snapshot
        required: true
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  compare:
    name: Release x64 against latest Samandarin release
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download Release x64 snapshot from PR Build
        uses: actions/download-artifact@v4
        with:
          name: pr-build-x64-release-binary-size
          path: pr-build-snapshot

      - name: Checkout PR head tools
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          path: head

      - name: Checkout canonical repository with release tags
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: baseline
          fetch-depth: 0
          submodules: recursive

      - name: Resolve latest Samandarin release baseline
        id: baseline
        run: |
          $resolved = ./head/tools/binary_size/resolve_release_baseline.ps1 `
            -RepositoryPath ./baseline | ConvertFrom-Json
          "tag=$($resolved.tag)" | Add-Content -Path $env:GITHUB_OUTPUT
          "commit=$($resolved.commit)" | Add-Content -Path $env:GITHUB_OUTPUT
          Write-Host "Binary size baseline: $($resolved.tag) at $($resolved.commit)"
          git -C baseline checkout --detach $resolved.commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C baseline submodule sync --recursive
          git -C baseline submodule update --init --recursive --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read PR Build selection
        id: selection
        run: |
          $selection = Get-Content ./pr-build-snapshot/build-selection.json -Raw | ConvertFrom-Json
          $projects = @($selection.projectPaths)
          $features = @()
          if ($selection.needsLua) { $features += 'lua-runtime' }
          if ($selection.needsUnrar) { $features += 'unrar-runtime' }
          if ($selection.needsFtpOpenssl) { $features += 'ftp-openssl' }
          "projects_json=$($projects | ConvertTo-Json -Compress -AsArray)" | Add-Content -Path $env:GITHUB_OUTPUT
          "features_json=$($features | ConvertTo-Json -Compress -AsArray)" | Add-Content -Path $env:GITHUB_OUTPUT
          Write-Host "Baseline projects: $($projects -join ', ')"
          Write-Host "Baseline vcpkg features: $($features -join ', ')"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install selected Release dependencies for baseline
        if: steps.selection.outputs.features_json != '[]'
        env:
          FEATURES_JSON: ${{ steps.selection.outputs.features_json }}
        run: |
          $features = @($env:FEATURES_JSON | ConvertFrom-Json)
          ./baseline/tools/vcpkg/build-third-party-libs.ps1 `
            -Triplet x64-windows `
            -VcpkgRoot ([IO.Path]::GetFullPath('./binary-size-vcpkg')) `
            -NoDefaultFeatures `
            -ManifestFeature $features `
            -SkipLegacyCopy

      - name: Build release baseline (Release x64)
        env:
          PROJECTS_JSON: ${{ steps.selection.outputs.projects_json }}
        run: |
          $outputRoot = [IO.Path]::GetFullPath('./binary-size-out/baseline').TrimEnd('\') + '\'
          New-Item -ItemType Directory -Force -Path $outputRoot, (Join-Path $outputRoot 'salamander\Release_x64') | Out-Null
          $projects = @($env:PROJECTS_JSON | ConvertFrom-Json)
          foreach ($project in $projects) {
            $path = Join-Path ./baseline $project
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Warning "Project does not exist in the baseline and will be reported as added: $project"
              continue
            }
            msbuild $path `
              /m `
              /t:Rebuild `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:PreferredToolArchitecture=x64 `
              "/p:OPENSAL_BUILD_DIR=$outputRoot" `
              /p:OpenSalamanderReportBinarySize=false `
              /nr:false `
              /v:m
            if ($LASTEXITCODE -ne 0) {
              throw "Release x64 baseline build failed for $project."
            }
          }

      - name: Generate binary size comparison
        id: report
        env:
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        run: |
          New-Item -ItemType Directory -Force -Path ./binary-size-report | Out-Null
          ./head/tools/binary_size/report_binary_sizes.ps1 `
            -BaselineRoot ./binary-size-out/baseline/salamander/Release_x64 `
            -CurrentSnapshotJson ./pr-build-snapshot/current-snapshot.json `
            -BaselineTag $env:BASELINE_TAG `
            -BaselineCommit $env:BASELINE_COMMIT `
            -CurrentLabel '${{ inputs.head_sha }}' `
            -OutputJson ./binary-size-report/report.json `
            -OutputMarkdown ./binary-size-report/report.md
          Get-Content ./binary-size-report/report.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $report = Get-Content ./binary-size-report/report.json -Raw | ConvertFrom-Json
          "title=$($report.summary.title)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Show size summary on the PR check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          REPORT_TITLE: ${{ steps.report.outputs.title }}
        run: |
          $summary = Get-Content ./binary-size-report/report.md -Raw
          @{
            output = @{
              title = $env:REPORT_TITLE
              summary = $summary
            }
          } |
            ConvertTo-Json -Depth 3 -Compress |
            gh api `
              --method PATCH `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              "repos/$env:GITHUB_REPOSITORY/check-runs/$env:CHECK_RUN_ID" `
              --input -

      - name: Upload binary size report
        if: always() && hashFiles('binary-size-report/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: binary-size-report
          path: binary-size-report/*
          if-no-files-found: error
          retention-days: 14
