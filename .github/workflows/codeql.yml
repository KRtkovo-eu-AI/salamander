name: CodeQL Security Scan

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number whose changed files determine whether analysis is needed
        required: true
        type: number
      target_ref:
        description: Exact PR head commit to analyze
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target-ref:
        description: 'Branch, tag, or commit SHA to analyze'
        required: false
        default: main

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze C++ (MSBuild)
    runs-on: windows-2025

    defaults:
      run:
        shell: pwsh

    env:
      BUILD_CONFIGURATION: Release
      PROJECT_PATH: '.\\src\\vcxproj\\salamand.vcxproj'
      SOLUTION_PATH: '.\\src\\vcxproj\\salamand.sln'
      LOG_DIRECTORY: build_logs

    steps:
      - name: Check whether CodeQL should run
        id: codeql_gate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_analyze', 'true');
              core.info('Manual dispatch; CodeQL analysis will run.');
              return;
            }

            const pullNumber = Number('${{ inputs.pr_number }}');
            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              core.setOutput('should_analyze', 'false');
              core.info('No valid pull request number was supplied; CodeQL analysis steps will be skipped.');
              return;
            }


            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              },
            );

            const relevantFiles = changedFiles
              .map((file) => file.filename)
              .filter((filename) => /^src\/(?!plugins\/).+\.(cpp|h)$/i.test(filename));

            if (relevantFiles.length === 0) {
              core.setOutput('should_analyze', 'false');
              core.info('No main-project .cpp or .h files changed; CodeQL analysis steps will be skipped while the required workflow succeeds.');
              return;
            }

            core.setOutput('should_analyze', 'true');
            core.info(`CodeQL analysis will run because these main-project .cpp/.h files changed: ${relevantFiles.join(', ')}`);

      - name: Checkout repository
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.event.inputs['target-ref'] || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild in PATH (VS2026)
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Register MSVC problem matcher
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: ammaraskar/msvc-problem-matcher@master

      # The manual full-solution build includes luaruntime. Install only its
      # manifest feature; do not build the unshipped SFTP plug-in in CodeQL.
      - name: Install Lua runtime dependency
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        run: |
          .\tools\vcpkg\build-third-party-libs.ps1 -Triplet x64-windows -NoDefaultFeatures -ManifestFeature lua-runtime -SkipLegacyCopy
      - name: Initialize CodeQL
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended
          ram: 14144
          threads: 4


      - name: Build with MSBuild (Release | x64)
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $suffix = "codeql-x64-run$($env:GITHUB_RUN_NUMBER)"
          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-$suffix.log"

          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"

          $buildPath = $env:PROJECT_PATH
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $solutionPath = Join-Path (Get-Location) $env:SOLUTION_PATH
            $solutionDir = Split-Path -Parent $solutionPath
            $solutionFilterPath = Join-Path $solutionDir 'salamand-without-sftp.slnf'
            $excludedProjects = @('sftp', 'lang_sftp', 'zip2sfx')
            $projects = Select-String -LiteralPath $solutionPath -Pattern '^Project\("\{[^}]+\}"\) = "([^"]+)", "([^"]+)", "\{[^}]+\}"' |
              ForEach-Object {
                [pscustomobject]@{
                  Name = $_.Matches[0].Groups[1].Value
                  Path = $_.Matches[0].Groups[2].Value
                }
              } |
              Where-Object { $_.Path -match '\.(?:vcxproj|csproj)$' -and $_.Name -notin $excludedProjects } |
              ForEach-Object { $_.Path }

            @{
              solution = @{
                path = Split-Path -Leaf $solutionPath
                projects = @($projects)
              }
            } | ConvertTo-Json -Depth 4 | Set-Content -Path $solutionFilterPath -Encoding UTF8

            $buildPath = $solutionFilterPath
            Write-Host "Building full solution without SFTP projects via $buildPath"
          } else {
            Write-Host "Building $buildPath"
          }

          $arguments = @(
            $buildPath
            '/m'
            '/t:Rebuild'
            "/p:Configuration=$($env:BUILD_CONFIGURATION)"
            '/p:Platform=x64'
            '/p:PreferredToolArchitecture=x64'
            '/nr:false'
            '/v:m'
          )

          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Setup Python
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Perform CodeQL Analysis
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
          upload: never
          output: ${{ github.workspace }}/codeql-sarif
          wait-for-processing: false

      # GitHub's compare API truncates at 300 files, so large PRs mislabel
      # baseline alerts as new. Restrict the uploaded SARIF to lines added or
      # modified in this pull request using the paginated files API.
      - name: Keep CodeQL alerts on PR-changed lines
        if: >-
          steps.codeql_gate.outputs.should_analyze == 'true' &&
          github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $sarifFiles = @(Get-ChildItem -Path "${{ github.workspace }}/codeql-sarif" -Filter *.sarif)
          if ($sarifFiles.Count -eq 0) { throw "CodeQL SARIF output was not produced." }
          foreach ($sarif in $sarifFiles) {
            python tools/codeql/filter_sarif_to_pr_diff.py `
              --sarif $sarif.FullName `
              --output $sarif.FullName `
              --repo ${{ github.repository }} `
              --pr ${{ inputs.pr_number }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload CodeQL SARIF
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/codeql-sarif
          category: "/language:cpp"
          wait-for-processing: true

      - name: Upload build logs
        if: always() && steps.codeql_gate.outputs.should_analyze == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-msbuild-logs
          path: |
            ${{ env.LOG_PATH }}
          if-no-files-found: warn
