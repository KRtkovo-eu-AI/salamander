name: CodeQL Security Scan

on:
  pull_request:
    branches: [main, darkmode, dev_tabs, 'release/*']
  workflow_dispatch:
    inputs:
      target-ref:
        description: 'Branch, tag, or commit SHA to analyze'
        required: false
        default: main

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze C++ (MSBuild)
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      BUILD_CONFIGURATION: Release
      # SFTP is not part of CodeQL coverage; keep this off so the workflow does
      # not prepare the SFTP plugin or install its vcpkg dependencies.
      BUILD_SFTP_PLUGIN: 'false'
      PROJECT_PATH: '.\\src\\vcxproj\\salamand.vcxproj'
      SOLUTION_PATH: '.\\src\\vcxproj\\salamand.sln'
      LOG_DIRECTORY: build_logs

    steps:
      - name: Check whether CodeQL should run
        id: codeql_gate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('should_analyze', 'true');
              core.info('Not a pull request event; CodeQL analysis will run.');
              return;
            }

            const pull = context.payload.pull_request;
            if (!pull) {
              core.setOutput('should_analyze', 'false');
              core.info('No pull request payload found; CodeQL analysis steps will be skipped.');
              return;
            }


            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              },
            );

            const relevantFiles = changedFiles
              .map((file) => file.filename)
              .filter((filename) => /^src\/(?!plugins\/).+\.(cpp|h)$/i.test(filename));

            if (relevantFiles.length === 0) {
              core.setOutput('should_analyze', 'false');
              core.info('No main-project .cpp or .h files changed; CodeQL analysis steps will be skipped while the required workflow succeeds.');
              return;
            }

            core.setOutput('should_analyze', 'true');
            core.info(`CodeQL analysis will run because these main-project .cpp/.h files changed: ${relevantFiles.join(', ')}`);

      - name: Checkout repository
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs['target-ref'] || github.ref }}
          fetch-depth: 2

      - name: Initialize CodeQL
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended
          ram: 14144
          threads: 4

      - name: Setup MSBuild in PATH (VS2022)
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Register MSVC problem matcher
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build with MSBuild (Release | x64)
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $suffix = "codeql-x64-run$($env:GITHUB_RUN_NUMBER)"
          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-$suffix.log"

          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"

          $buildPath = $env:PROJECT_PATH
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $solutionPath = Join-Path (Get-Location) $env:SOLUTION_PATH
            $solutionDir = Split-Path -Parent $solutionPath
            $solutionBuildPath = Join-Path $solutionDir 'salamand-codeql-without-sftp.sln'
            $excludedProjects = @{
              '514DA5DF-C9D5-4A39-9BE6-CBCFA6CE0D5A' = 'sftp'
              '2D3A2ADD-498B-4420-8E08-6A9FC9C09D5E' = 'lang_sftp'
            }
            $excludedProjectGuids = $excludedProjects.Keys | ForEach-Object { $_.ToUpperInvariant() }
            $projectHeaderPattern = '^Project\("\{[^}]+\}"\) = "([^"]+)", "([^"]+)", "\{([^}]+)\}"'
            $lines = Get-Content -LiteralPath $solutionPath
            $filteredLines = New-Object System.Collections.Generic.List[string]
            $skipProjectBlock = $false

            foreach ($line in $lines) {
              if ($line -match $projectHeaderPattern) {
                $projectName = $Matches[1]
                $projectGuid = $Matches[3].ToUpperInvariant()
                $skipProjectBlock = $excludedProjectGuids -contains $projectGuid

                if ($skipProjectBlock) {
                  Write-Host "Excluding CodeQL project from solution build: $projectName ($($excludedProjects[$projectGuid]))"
                  continue
                }
              }

              if ($skipProjectBlock) {
                if ($line -eq 'EndProject') {
                  $skipProjectBlock = $false
                }
                continue
              }

              $referencesExcludedProject = $false
              foreach ($projectGuid in $excludedProjectGuids) {
                if ($line -match [regex]::Escape("{$projectGuid}")) {
                  $referencesExcludedProject = $true
                  break
                }
              }

              if (-not $referencesExcludedProject) {
                $filteredLines.Add($line)
              }
            }

            $filteredLines | Set-Content -Path $solutionBuildPath -Encoding UTF8
            $buildPath = $solutionBuildPath
            Write-Host "Building full solution without SFTP projects via $buildPath"
          } else {
            Write-Host "Building $buildPath"
          }

          $arguments = @(
            $buildPath
            '/m'
            '/t:Rebuild'
            "/p:Configuration=$($env:BUILD_CONFIGURATION)"
            '/p:Platform=x64'
            '/p:PreferredToolArchitecture=x64'
            '/nr:false'
            '/v:m'
          )

          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Perform CodeQL Analysis
        if: steps.codeql_gate.outputs.should_analyze == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:cpp'

      - name: Upload build logs
        if: always() && steps.codeql_gate.outputs.should_analyze == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-msbuild-logs
          path: |
            ${{ env.LOG_PATH }}
          if-no-files-found: warn
