# | Date | Summary | Reason | Ticket | Model |
# | 2026-11-04 | Publish fork test reports as a job summary and keep the latest run. | Check runs from this workflow were showing up under Source Code Growth. | | Grok 4.7 |

name: PR Test Report

on:
  workflow_run:
    workflows: ['PR Tests']
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: pr-test-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report:
    name: Publish test results
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0] != null
      }}
    runs-on: ubuntu-latest

    steps:
      # Same-repository PRs already publish the report on the PR Tests job
      # summary. Skipping this whole job left the workflow grey on every in-repo
      # PR. Succeed here instead. Forks publish the summary here, without a
      # separate check run that GitHub would attach to another workflow.
      - name: Same-repository reports already published
        if: github.event.workflow_run.head_repository.full_name == github.repository
        run: |
          echo "Same-repository PR; Native and Python test reports were published by PR Tests."

      - name: Report native and source-contract tests
        if: >-
          ${{
            !cancelled() &&
            github.event.workflow_run.head_repository.full_name != github.repository
          }}
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: Native and source-contract tests
          path: native.xml
          reporter: java-junit
          fail-on-empty: true
          # Do not create a check run. GitHub would attach it to another workflow
          # already running for this commit, often Source Code Growth.
          use-actions-summary: true

      - name: Report Python tests
        if: >-
          ${{
            !cancelled() &&
            github.event.workflow_run.head_repository.full_name != github.repository
          }}
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: Python tests
          path: python.xml
          reporter: python-xunit
          fail-on-empty: true
          # Do not create a check run. GitHub would attach it to another workflow
          # already running for this commit, often Source Code Growth.
          use-actions-summary: true
