name: PR Test Report

on:
  workflow_run:
    workflows: ['PR Tests']
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Publish test results
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].head.repo.full_name != github.repository
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Report native and source-contract tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: Native and source-contract tests
          path: native.xml
          reporter: java-junit
          fail-on-empty: true
          use-actions-summary: true

      - name: Report Python tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: Python tests
          path: python.xml
          reporter: python-xunit
          fail-on-empty: true
          use-actions-summary: true
