name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native and Python tests
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run native and source-contract tests
        id: native_tests
        continue-on-error: true
        run: >
          ./tools/run_native_tests.ps1
          -Configuration Debug
          -Platform x64
          -ResultsPath test-results/native.xml

      - name: Run Python unit tests
        id: python_tests
        continue-on-error: true
        run: |
          python -m pytest `
            src/plugins/automation/tests/salamatrix_ai_local_tests.py `
            tools/localization/tests `
            --junitxml=test-results/python.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Report native and source-contract tests
        id: native_report
        if: >-
          ${{
            !cancelled() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Native and source-contract tests
          path: test-results/native.xml
          reporter: java-junit
          fail-on-empty: true
          # v3 publishes either a Job Summary or a Check Run. Keep this false
          # so the detailed result is visible as a separate PR check.
          use-actions-summary: false

      - name: Report Python tests
        id: python_report
        if: >-
          ${{
            !cancelled() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Python tests
          path: test-results/python.xml
          reporter: python-xunit
          fail-on-empty: true
          # v3 publishes either a Job Summary or a Check Run. Keep this false
          # so the detailed result is visible as a separate PR check.
          use-actions-summary: false

      - name: Fail when a test group failed
        if: ${{ !cancelled() }}
        env:
          NATIVE_OUTCOME: ${{ steps.native_tests.outcome }}
          PYTHON_OUTCOME: ${{ steps.python_tests.outcome }}
          NATIVE_REPORT_OUTCOME: ${{ steps.native_report.outcome }}
          PYTHON_REPORT_OUTCOME: ${{ steps.python_report.outcome }}
        run: |
          if ($env:NATIVE_OUTCOME -ne 'success' -or
              $env:PYTHON_OUTCOME -ne 'success') {
              throw "Test failure: native=$env:NATIVE_OUTCOME, python=$env:PYTHON_OUTCOME"
          }
          if ($env:NATIVE_REPORT_OUTCOME -eq 'failure' -or
              $env:PYTHON_REPORT_OUTCOME -eq 'failure') {
              throw "Test reporting failure: native=$env:NATIVE_REPORT_OUTCOME, python=$env:PYTHON_REPORT_OUTCOME"
          }
