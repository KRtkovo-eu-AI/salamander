name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native and Python tests
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run native and source-contract tests
        id: native_tests
        continue-on-error: true
        run: >
          ./tools/run_native_tests.ps1
          -Configuration Debug
          -Platform x64
          -ResultsPath test-results/native.xml

      - name: Run Python unit tests
        id: python_tests
        continue-on-error: true
        run: |
          python -m pytest `
            src/plugins/automation/tests/salamatrix_ai_local_tests.py `
            tools/localization/tests `
            --junitxml=test-results/python.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Fail when a test group failed
        if: ${{ !cancelled() }}
        env:
          NATIVE_OUTCOME: ${{ steps.native_tests.outcome }}
          PYTHON_OUTCOME: ${{ steps.python_tests.outcome }}
        run: |
          if ($env:NATIVE_OUTCOME -ne 'success' -or
              $env:PYTHON_OUTCOME -ne 'success') {
              throw "Test failure: native=$env:NATIVE_OUTCOME, python=$env:PYTHON_OUTCOME"
          }
