name: Suggest entry into Plugin catalog
description: Suggest a plugin to add to the catalog or changes to an existing plugin entry.
title: "Plugin catalog: "
type: Plugin Catalog entry
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest a native Open Salamander plugin for the Plugin catalog or to update an existing entry.

        Entries submitted through this form use `packageType: plugin`. English name and description are required; all other translations are optional.
  - type: input
    id: plugin-id
    attributes:
      label: Plugin ID
      description: Provide the unique, stable catalog identifier using lowercase ASCII letters, digits, and hyphens where needed.
      placeholder: example-plugin
    validations:
      required: true
  - type: input
    id: english-name
    attributes:
      label: English name
      description: Enter the plugin name in English.
      placeholder: Example Plugin
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Enter the plugin author or organization exactly as it should appear in the catalog.
      placeholder: Author or organization name
    validations:
      required: true
  - type: textarea
    id: english-description
    attributes:
      label: English description
      description: Briefly explain in English what the plugin does.
      placeholder: Describe the plugin's purpose and main capabilities.
    validations:
      required: true
  - type: input
    id: latest-version
    attributes:
      label: Latest version
      description: Enter the latest available version, including architecture when applicable.
      placeholder: e.g. 1.0 (x64)
    validations:
      required: true
  - type: input
    id: homepage-url
    attributes:
      label: Homepage URL
      description: Link to the plugin homepage, source repository, or primary information page.
      placeholder: https://example.com/plugin
    validations:
      required: true
  - type: input
    id: download-page-url
    attributes:
      label: Download page URL
      description: Link directly to the current package or to a page where the supported plugin can be downloaded.
      placeholder: https://example.com/plugin/download
    validations:
      required: true
  - type: input
    id: package-sha256
    attributes:
      label: Package SHA-256
      description: Lowercase hex SHA-256 of the official `.7z` payload. Required for official auto-install. Do not copy the digest from GitHub release notes; compute it from the archive bytes. Leave empty for unofficial browser-only entries.
      placeholder: 64 lowercase hex characters
    validations:
      required: false
  - type: dropdown
    id: network-access
    attributes:
      label: Network access
      description: Curated capability disclosure. Native plugins still run in-process; this is not a sandbox.
      options:
        - no
        - possible
        - yes
    validations:
      required: true
  - type: dropdown
    id: external-processes
    attributes:
      label: External processes
      options:
        - no
        - yes
    validations:
      required: true
  - type: dropdown
    id: script-execution
    attributes:
      label: Script execution
      options:
        - no
        - yes
    validations:
      required: true
  - type: dropdown
    id: active-web-content
    attributes:
      label: Active web content
      options:
        - no
        - yes
    validations:
      required: true
  - type: dropdown
    id: elevation
    attributes:
      label: Elevation
      description: Use `install` when the package is typically copied into Program Files and may prompt for elevation. Use `never` when install and runtime stay unelevated.
      options:
        - never
        - install
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: Icon
      description: Use `plugin` to extract the installed `.spl` icon, or provide an absolute URL, catalog-relative URL, or catalog-local image path.
      placeholder: plugin or https://example.com/plugin.png
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Optionally list catalog plugin IDs that must be installed with this plugin, one per line.
      placeholder: |
        dependency-one
        dependency-two
    validations:
      required: false
  - type: input
    id: chinesesimplified-name
    attributes:
      label: Chinese (Simplified) name
      description: Optionally enter the plugin name in Simplified Chinese.
    validations:
      required: false
  - type: textarea
    id: chinesesimplified-description
    attributes:
      label: Chinese (Simplified) description
      description: Optionally describe the plugin in Simplified Chinese.
    validations:
      required: false
  - type: input
    id: czech-name
    attributes:
      label: Czech name
      description: Optionally enter the plugin name in Czech.
    validations:
      required: false
  - type: textarea
    id: czech-description
    attributes:
      label: Czech description
      description: Optionally describe the plugin in Czech.
    validations:
      required: false
  - type: input
    id: german-name
    attributes:
      label: German name
      description: Optionally enter the plugin name in German.
    validations:
      required: false
  - type: textarea
    id: german-description
    attributes:
      label: German description
      description: Optionally describe the plugin in German.
    validations:
      required: false
  - type: input
    id: dutch-name
    attributes:
      label: Dutch name
      description: Optionally enter the plugin name in Dutch.
    validations:
      required: false
  - type: textarea
    id: dutch-description
    attributes:
      label: Dutch description
      description: Optionally describe the plugin in Dutch.
    validations:
      required: false
  - type: input
    id: hungarian-name
    attributes:
      label: Hungarian name
      description: Optionally enter the plugin name in Hungarian.
    validations:
      required: false
  - type: textarea
    id: hungarian-description
    attributes:
      label: Hungarian description
      description: Optionally describe the plugin in Hungarian.
    validations:
      required: false
  - type: input
    id: russian-name
    attributes:
      label: Russian name
      description: Optionally enter the plugin name in Russian.
    validations:
      required: false
  - type: textarea
    id: russian-description
    attributes:
      label: Russian description
      description: Optionally describe the plugin in Russian.
    validations:
      required: false
  - type: input
    id: french-name
    attributes:
      label: French name
      description: Optionally enter the plugin name in French.
    validations:
      required: false
  - type: textarea
    id: french-description
    attributes:
      label: French description
      description: Optionally describe the plugin in French.
    validations:
      required: false
  - type: input
    id: slovak-name
    attributes:
      label: Slovak name
      description: Optionally enter the plugin name in Slovak.
    validations:
      required: false
  - type: textarea
    id: slovak-description
    attributes:
      label: Slovak description
      description: Optionally describe the plugin in Slovak.
    validations:
      required: false
  - type: input
    id: romanian-name
    attributes:
      label: Romanian name
      description: Optionally enter the plugin name in Romanian.
    validations:
      required: false
  - type: textarea
    id: romanian-description
    attributes:
      label: Romanian description
      description: Optionally describe the plugin in Romanian.
    validations:
      required: false
  - type: input
    id: spanish-name
    attributes:
      label: Spanish name
      description: Optionally enter the plugin name in Spanish.
    validations:
      required: false
  - type: textarea
    id: spanish-description
    attributes:
      label: Spanish description
      description: Optionally describe the plugin in Spanish.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add compatibility notes, screenshots, licensing information, update details, or other context useful when reviewing the entry.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing catalog and issues and did not find an equivalent request.
          required: true
        - label: I verified that the homepage and download links are publicly accessible.
          required: true
